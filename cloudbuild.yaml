steps:
  # ============== BACKEND ==============
  # Step 1: Install backend dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
    dir: 'backend'
    id: 'install-backend'

  # Step 2: Generate Prisma client
  - name: 'node:20'
    entrypoint: 'npx'
    args: ['prisma', 'generate']
    dir: 'backend'
    id: 'prisma-generate'
    waitFor: ['install-backend']

  # Step 3: Lint backend
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'lint']
    dir: 'backend'
    id: 'lint-backend'
    waitFor: ['prisma-generate']

  # Step 4: Build TypeScript
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'backend'
    id: 'build-backend'
    waitFor: ['lint-backend']

  # Step 5: Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/backend:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/backend:latest'
      - './backend'
    id: 'docker-build-backend'
    waitFor: ['build-backend']

  # Step 6: Push backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/backend:$SHORT_SHA'
    id: 'docker-push-backend-sha'
    waitFor: ['docker-build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/backend:latest'
    id: 'docker-push-backend-latest'
    waitFor: ['docker-build-backend']

  # Step 7: Run database migrations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Get the database URL from Secret Manager
        DATABASE_URL=$(gcloud secrets versions access latest --secret=adventure-roulette-database-url)
        export DATABASE_URL
        
        # Install Node.js and run migrations
        apt-get update && apt-get install -y nodejs npm
        cd backend
        npm ci
        npx prisma migrate deploy
    id: 'db-migrate'
    waitFor: ['docker-push-backend-sha']

  # Step 8: Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'run'
      - 'deploy'
      - 'adventure-roulette-backend'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/backend:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
    id: 'deploy-backend'
    waitFor: ['db-migrate', 'docker-push-backend-latest']

  # ============== FRONTEND ==============
  # Step 9: Build frontend Docker image (runs in parallel with backend)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_BACKEND_URL}/v1'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/frontend:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/frontend:latest'
      - './frontend'
    id: 'docker-build-frontend'
    waitFor: ['-']  # Start immediately (parallel with backend)

  # Step 10: Push frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/frontend:$SHORT_SHA'
    id: 'docker-push-frontend-sha'
    waitFor: ['docker-build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/frontend:latest'
    id: 'docker-push-frontend-latest'
    waitFor: ['docker-build-frontend']

  # Step 11: Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'run'
      - 'deploy'
      - 'adventure-roulette-frontend'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/frontend:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production'
    id: 'deploy-frontend'
    waitFor: ['docker-push-frontend-sha', 'docker-push-frontend-latest']

substitutions:
  _REGION: 'europe-west1'
  _BACKEND_URL: 'https://whereto-815989745598.europe-west1.run.app'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_MEDIUM'

timeout: '1200s'

