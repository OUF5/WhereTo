steps:
  # Step 1: Install backend dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
    dir: 'backend'
    id: 'install-backend'

  # Step 2: Generate Prisma client
  - name: 'node:20'
    entrypoint: 'npx'
    args: ['prisma', 'generate']
    dir: 'backend'
    id: 'prisma-generate'
    waitFor: ['install-backend']

  # Step 3: Lint backend
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'lint']
    dir: 'backend'
    id: 'lint-backend'
    waitFor: ['prisma-generate']

  # Step 4: Build TypeScript
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'backend'
    id: 'build-backend'
    waitFor: ['lint-backend']

  # Step 5: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/backend:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/backend:latest'
      - './backend'
    id: 'docker-build'
    waitFor: ['build-backend']

  # Step 6: Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/backend:$SHORT_SHA'
    id: 'docker-push-sha'
    waitFor: ['docker-build']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/backend:latest'
    id: 'docker-push-latest'
    waitFor: ['docker-build']

  # Step 7: Run database migrations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Get the database URL from Secret Manager
        DATABASE_URL=$(gcloud secrets versions access latest --secret=adventure-roulette-database-url)
        export DATABASE_URL
        
        # Install Node.js and run migrations
        apt-get update && apt-get install -y nodejs npm
        cd backend
        npm ci
        npx prisma migrate deploy
    id: 'db-migrate'
    waitFor: ['docker-push-sha']

  # Step 8: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'run'
      - 'deploy'
      - 'adventure-roulette-backend'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/adventure-roulette/backend:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
    id: 'deploy'
    waitFor: ['db-migrate', 'docker-push-latest']

substitutions:
  _REGION: 'me-central1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_MEDIUM'

timeout: '1200s'

